name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('tiffin_tracker_backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        working-directory: tiffin_tracker_backend
        run: |
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run ruff (linter)
        working-directory: tiffin_tracker_backend
        run: ruff check app/

      - name: Run mypy (type checker)
        working-directory: tiffin_tracker_backend
        run: mypy app/ --ignore-missing-imports

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('tiffin_tracker_app/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        working-directory: tiffin_tracker_app
        run: npm ci

      - name: Run ESLint
        working-directory: tiffin_tracker_app
        run: npm run lint

      - name: Build (TypeScript + Vite)
        working-directory: tiffin_tracker_app
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.railway.app
